name: Build Kai Lite APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-37" "build-tools;37.0.0" "ndk;29.0.14206865"

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Build Kai Lite FOSS release APK
        run: ./gradlew :androidApp:assembleFossRelease --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: kai-lite-foss-release
          path: androidApp/build/outputs/apk/foss/release/*.apk
          if-no-files-found: error
          retention-days: 14
