name: Build Kai Lite APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Android SDK packages
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0 ndk;27.2.12479018'

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Build Kai Lite FOSS release APK
        run: ./gradlew :androidApp:assembleFossRelease --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: kai-lite-foss-release
          path: androidApp/build/outputs/apk/foss/release/*.apk
          if-no-files-found: error
          retention-days: 14
